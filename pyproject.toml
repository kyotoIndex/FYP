[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fyp-amplora"
version = "0.2.0"
description = "Amplified restricted training and component aggregation for heterogeneous federated LoRA"
requires-python = ">=3.11"
dependencies = ["torch==2.8.0", "transformers==4.57.1", "numpy==2.2.6", "huggingface-hub==0.36.2"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
figures = ["matplotlib==3.10.9"]

[tool.setuptools]
packages = ["scra", "headroom", "fedft"]

[tool.setuptools.package-dir]
scra = "federated_finetuning/experiments/scra_diagnostics_20261017/scra"
headroom = "federated_finetuning/experiments/headroom_coldstart_20261017/headroom"
fedft = "federated_finetuning/fedft"

[tool.pytest.ini_options]
testpaths = ["federated_finetuning/experiments/scra_diagnostics_20261017/tests", "federated_finetuning/experiments/headroom_coldstart_20261017/tests"]
addopts = "-ra"
